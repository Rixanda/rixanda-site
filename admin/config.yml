backend:
  name: git-gateway
  branch: main
  identity_url: "https://heartfelt-druid-139eb1.netlify.app/.netlify/identity"
  gateway_url: "https://heartfelt-druid-139eb1.netlify.app/.netlify/git"

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "products"
    label: "Products"
    files:
      - file: "data/products.json"
        label: "All products"
        name: "products"
        fields:
          - {label: "Products", name: "products", widget: "list", fields: [
              {label: "ID (no spaces, used in the link)", name: "id", widget: "string"},
              {label: "Name", name: "name", widget: "string"},
              {label: "Category (type any name — new ones appear on the site automatically)", name: "category", widget: "string"},
              {label: "Price (USD, numbers only)", name: "price", widget: "string"},
              {label: "Description", name: "description", widget: "text"},
              {label: "Cover image", name: "cover_image", widget: "image", required: false},
              {label: "Product file (PDF)", name: "file_url", widget: "file", required: false}
            ]}
